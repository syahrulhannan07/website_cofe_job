services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    depends_on:
      - db
    command: >
      sh -c "composer install --no-interaction &&
             php artisan config:clear &&
             php artisan cache:clear &&
             php artisan migrate --force &&
             php artisan serve --host=0.0.0.0 --port=8000"
    restart: unless-stopped

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: cafe_db
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - db
    command: >
      sh -c "composer install --no-interaction &&
             php artisan config:clear &&
             php artisan cache:clear &&
             php artisan migrate --force &&
             php artisan queue:work --tries=3 --max-time=3600 --sleep=3"
    restart: unless-stopped

  vite:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "test -d node_modules/vite || npm install; npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - node_modules_data:/app/node_modules
    restart: unless-stopped

volumes:
  db_data:
  node_modules_data:
